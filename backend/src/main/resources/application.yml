# === AgroSmart Backend Configuration ===

spring:
  application:
    name: agrosmart

  # === Database ===
  datasource:
    url: jdbc:mysql://localhost:3306/agrosmart?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # === Jackson ===
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null

  # === Spring AI Ollama ===
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7

# === Server ===
server:
  port: 8081
  servlet:
    context-path: /

# === App Configuration ===
app:
  jwt:
    secret: YWdyb3NtYXJ0LWluZGlhLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTIwMjQ=
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  # === CORS ===
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

  # === ML Service ===
  ml-service:
    url: http://localhost:8000

# === Logging ===
logging:
  level:
    root: INFO
    com.agrosmart: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
