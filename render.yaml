services:
  # 1. AgroSmart Spring Boot Backend
  - type: web
    name: agrosmart-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false # Set to your Cloud MySQL JDBC URL (e.g. TiDB / Aiven / Clever Cloud)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # Set your DB username
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Set your DB password
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: agrosmart-ml
          property: host

  # 2. AgroSmart Python ML Inference Service
  - type: web
    name: agrosmart-ml
    runtime: docker
    dockerfilePath: ml-service/Dockerfile
    dockerContext: ml-service
    plan: free
